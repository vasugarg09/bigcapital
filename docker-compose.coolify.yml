services:
  proxy:
    build:
      context: ./docker/envoy
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
      webapp:
        condition: service_started
    expose:
      - "80"

  webapp:
    image: bigcapitalhq/webapp:${BIGCAPITAL_VERSION:-v0.25.23}
    restart: unless-stopped

  server:
    image: bigcapitalhq/server:${BIGCAPITAL_VERSION:-v0.25.23}
    restart: unless-stopped
    depends_on:
      database_migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: "${DB_USER:-bigcapital}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_CHARSET: "${DB_CHARSET:-utf8}"

      SYSTEM_DB_HOST: mysql
      SYSTEM_DB_PORT: "3306"
      SYSTEM_DB_USER: "${DB_USER:-bigcapital}"
      SYSTEM_DB_PASSWORD: "${DB_PASSWORD}"
      SYSTEM_DB_NAME: "${SYSTEM_DB_NAME:-bigcapital_system}"
      SYSTEM_DB_CHARSET: "${DB_CHARSET:-utf8}"

      TENANT_DB_HOST: mysql
      TENANT_DB_PORT: "3306"
      TENANT_DB_USER: "${DB_USER:-bigcapital}"
      TENANT_DB_PASSWORD: "${DB_PASSWORD}"
      TENANT_DB_NAME_PERFIX: "${TENANT_DB_NAME_PERFIX:-bigcapital_tenant_}"

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_HOST: redis
      QUEUE_PORT: "6379"

      JWT_SECRET: "${JWT_SECRET}"
      BASE_URL: "${BASE_URL}"

      SIGNUP_DISABLED: "${SIGNUP_DISABLED:-false}"
      SIGNUP_ALLOWED_DOMAINS: "${SIGNUP_ALLOWED_DOMAINS:-}"
      SIGNUP_ALLOWED_EMAILS: "${SIGNUP_ALLOWED_EMAILS:-}"
      SIGNUP_EMAIL_CONFIRMATION: "${SIGNUP_EMAIL_CONFIRMATION:-false}"

      GOTENBERG_URL: "http://gotenberg:3000"
      GOTENBERG_DOCS_URL: "http://server:3000/public/"

      EXCHANGE_RATE_SERVICE: "${EXCHANGE_RATE_SERVICE:-open-exchange-rate}"
      OPEN_EXCHANGE_RATE_APP_ID: "${OPEN_EXCHANGE_RATE_APP_ID:-}"
      BANK_FEED_ENABLED: "${BANK_FEED_ENABLED:-false}"
      HOSTED_ON_BIGCAPITAL_CLOUD: "${HOSTED_ON_BIGCAPITAL_CLOUD:-false}"

      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_SECURE: "${MAIL_SECURE:-false}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-BigCapital}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-}"

  database_migration:
    image: bigcapitalhq/server:${BIGCAPITAL_VERSION:-v0.25.23}
    restart: "no"
    exclude_from_hc: true
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /app/packages/server
    command:
      - sh
      - -c
      - |
        node dist/cli.js system:migrate:latest &&
        node dist/cli.js tenants:migrate:latest
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: "${DB_USER:-bigcapital}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_CHARSET: "${DB_CHARSET:-utf8}"

      SYSTEM_DB_HOST: mysql
      SYSTEM_DB_PORT: "3306"
      SYSTEM_DB_USER: "${DB_USER:-bigcapital}"
      SYSTEM_DB_PASSWORD: "${DB_PASSWORD}"
      SYSTEM_DB_NAME: "${SYSTEM_DB_NAME:-bigcapital_system}"
      SYSTEM_DB_CHARSET: "${DB_CHARSET:-utf8}"

      TENANT_DB_HOST: mysql
      TENANT_DB_PORT: "3306"
      TENANT_DB_USER: "${DB_USER:-bigcapital}"
      TENANT_DB_PASSWORD: "${DB_PASSWORD}"
      TENANT_DB_NAME_PERFIX: "${TENANT_DB_NAME_PERFIX:-bigcapital_tenant_}"

  mysql:
    build:
      context: ./docker/mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${SYSTEM_DB_NAME:-bigcapital_system}"
      MARIADB_USER: "${DB_USER:-bigcapital}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${SYSTEM_DB_NAME:-bigcapital_system}"
      MYSQL_USER: "${DB_USER:-bigcapital}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    build:
      context: ./docker/redis
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:7
    restart: unless-stopped
    expose:
      - "3000"

volumes:
  mysql:
  redis:
